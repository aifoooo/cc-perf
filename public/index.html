<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cc-perf — Claude Code Performance Dashboard</title>
<script src="chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --text-dim: #8b949e;
    --accent: #58a6ff;
    --danger: #f85149;
    --success: #3fb950;
    --warning: #d2991d;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px 24px;
    max-width: 1400px;
    margin: 0 auto;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    font-size: 20px;
    font-weight: 600;
    color: var(--accent);
  }
  .controls {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  select {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 13px;
  }
  button {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
    font-size: 13px;
  }
  button:hover { background: #1f2937; }
  button.active { background: var(--accent); color: #000; border-color: var(--accent); }
  .cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
  }
  .card__label {
    font-size: 12px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
  }
  .card__value {
    font-size: 28px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .chart-row {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 12px;
    margin-bottom: 20px;
  }
  .chart-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    position: relative;
  }
  .chart-box h2 {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-dim);
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .chart-box canvas { max-height: 400px; min-height: 300px; }
  .chart-box.gantt-box {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .chart-box.gantt-box h2 {
    flex-shrink: 0;
  }
  .gantt-container {
    height: 400px;
    max-height: 50vh;
    width: 100%;
    overflow: auto;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #0d1117;
    position: relative;
  }
  /* 自定义甘特图样式 */
  .custom-gantt {
    min-width: 100%;
    width: max-content;
  }
  .custom-gantt .gantt-timeline {
    display: flex;
    flex-direction: column;
    gap: 0;
  }
  .custom-gantt .gantt-header-row {
    display: flex;
    align-items: flex-end;
    height: 32px;
    border-bottom: 1px solid var(--border);
    padding-left: 160px;
    position: sticky;
    top: 0;
    z-index: 2;
    background: var(--bg);
  }
  .custom-gantt .gantt-header-tick {
    position: absolute;
    font-size: 10px;
    color: var(--text-dim);
    transform: translateX(-50%);
    white-space: nowrap;
    bottom: 4px;
  }
  .custom-gantt .gantt-header-tick-line {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 1px;
    background: var(--border);
    opacity: 0.4;
  }
  .custom-gantt .gantt-task-row {
    display: flex;
    align-items: center;
    height: 32px;
    border-bottom: 1px solid rgba(48,54,61,0.4);
    position: relative;
  }
  .custom-gantt .gantt-task-row:hover {
    background: rgba(88,166,255,0.04);
  }
  .custom-gantt .gantt-row-label {
    width: 156px;
    min-width: 156px;
    padding: 0 12px 0 4px;
    font-size: 11px;
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    position: sticky;
    left: 0;
    z-index: 1;
    background: var(--surface);
    height: 100%;
    display: flex;
    align-items: center;
    border-right: 1px solid var(--border);
  }
  .custom-gantt .gantt-task-row:hover .gantt-row-label {
    background: #1a2332;
  }
  .custom-gantt .gantt-row-track {
    flex: 1;
    height: 100%;
    position: relative;
  }
  .custom-gantt .gantt-bar {
    position: absolute;
    top: 4px;
    bottom: 4px;
    border-radius: 4px;
    cursor: pointer;
    transition: opacity 0.15s;
    min-width: 4px;
    opacity: 0.85;
  }
  .custom-gantt .gantt-bar:hover {
    opacity: 1;
    z-index: 3;
    box-shadow: 0 0 0 2px rgba(255,255,255,0.3);
  }
  .custom-gantt .gantt-tooltip {
    display: none;
    position: fixed;
    background: #161b22;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 14px;
    color: var(--text);
    font-size: 12px;
    z-index: 100;
    pointer-events: none;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    max-width: 300px;
  }
  .slow-table {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 20px;
  }
  .slow-table h2 {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-dim);
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th, td {
    text-align: left;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
  }
  th { color: var(--text-dim); font-weight: 600; font-size: 11px; text-transform: uppercase; }
  tr:hover { background: rgba(88, 166, 255, 0.04); }
  .tool-tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
  }
  .summary-cell {
    max-width: 400px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--text-dim);
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 12px;
  }
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-dim);
  }
  .empty-state p { margin-top: 8px; font-size: 14px; }
</style>
</head>
<body>

<header>
  <h1>cc-perf</h1>
  <div class="controls">
    <select id="session-select">
      <option value="">-- 选择会话 --</option>
    </select>
    <button id="refresh-btn" title="刷新数据">↻</button>
    <button id="auto-refresh-btn" class="active" title="自动刷新">⟳ 自动</button>
  </div>
</header>

<div class="cards">
  <div class="card">
    <div class="card__label">总耗时</div>
    <div class="card__value" id="total-time">--</div>
  </div>
  <div class="card">
    <div class="card__label">调用次数</div>
    <div class="card__value" id="total-calls">--</div>
  </div>
  <div class="card">
    <div class="card__label">平均耗时</div>
    <div class="card__value" id="avg-duration">--</div>
  </div>
  <div class="card">
    <div class="card__label">最慢操作</div>
    <div class="card__value" id="max-duration" style="font-size:20px">--</div>
  </div>
</div>

<div class="chart-row">
  <div class="chart-box gantt-box">
    <h2>时间线（甘特图）</h2>
    <div class="gantt-container">
      <div id="gantt-chart"></div>
    </div>
  </div>
  <div class="chart-box">
    <h2>耗时分布</h2>
    <canvas id="donut-chart"></canvas>
  </div>
</div>

<div class="slow-table">
  <h2>最慢 Top 15 步</h2>
  <div id="slow-table-content">
    <table>
      <thead><tr><th>#</th><th>工具</th><th>耗时</th><th>操作</th></tr></thead>
      <tbody id="slow-tbody"></tbody>
    </table>
  </div>
</div>

<div id="empty-placeholder" class="empty-state" style="display:none">
  <p>暂无数据 — 执行一些操作后刷新即可</p>
</div>

<script>
// === 颜色方案（按工具类型） ===
const TOOL_COLORS = {
  Bash: 'rgba(255,99,132,0.85)',
  Read: 'rgba(54,162,235,0.85)',
  Write: 'rgba(255,205,86,0.85)',
  Edit: 'rgba(75,192,192,0.85)',
  Agent: 'rgba(153,102,255,0.85)',
  Grep: 'rgba(255,159,64,0.85)',
  Glob: 'rgba(201,203,207,0.85)',
  WebFetch: 'rgba(123,200,164,0.85)',
  WebSearch: 'rgba(232,160,191,0.85)',
  TaskOutput: 'rgba(148,148,148,0.85)',
  Skill: 'rgba(100,200,200,0.85)',
};
const DEFAULT_COLOR = 'rgba(168,168,168,0.85)';

const TOOL_BORDER_COLORS = {};
for (const [k, v] of Object.entries(TOOL_COLORS)) {
  TOOL_BORDER_COLORS[k] = v.replace('0.85', '1');
}
const DEFAULT_BORDER = 'rgba(168,168,168,1)';

function toolColor(tool) { return TOOL_COLORS[tool] || DEFAULT_COLOR; }
function toolBorder(tool) { return TOOL_BORDER_COLORS[tool] || DEFAULT_BORDER; }

// === 状态 ===
let currentSessionId = '';
let currentData = [];
let autoRefresh = true;
let donutChart = null;

// === 格式化 ===
function formatDuration(ms) {
  if (!ms && ms !== 0) return '--';
  if (ms < 1000) return `${ms}ms`;
  if (ms < 60000) return `${(ms / 1000).toFixed(1)}s`;
  const m = Math.floor(ms / 60000);
  const s = Math.round((ms % 60000) / 1000);
  return `${m}m${s}s`;
}

// === API ===
async function fetchJSON(url) {
  const res = await fetch(url);
  return res.json();
}

// === 加载会话列表 ===
async function loadSessions() {
  const sessions = await fetchJSON('/api/sessions');
  const select = document.getElementById('session-select');
  const current = select.value;
  select.innerHTML = '<option value="">-- 选择会话 --</option>';
  for (const s of sessions) {
    const opt = document.createElement('option');
    opt.value = s.id;
    const date = new Date(s.mtime).toLocaleString('zh-CN');
    opt.textContent = `${s.id.substring(0,12)}… — ${s.entry_count}次调用, ${formatDuration(s.total_ms)} — ${date}`;
    select.appendChild(opt);
  }
  // 保持选中或自动选最新
  if (current && sessions.find(s => s.id === current)) {
    select.value = current;
  } else if (sessions.length > 0 && !currentSessionId) {
    select.value = sessions[0].id;
    currentSessionId = sessions[0].id;
  }
  return sessions;
}

// === 加载会话数据 ===
async function loadSessionData(sessionId, since) {
  let url = `/api/session/${sessionId}`;
  if (since) url += `/since/${since}`;
  return fetchJSON(url);
}

// === 渲染 ===
function renderSummary(data) {
  const totalMs = data.reduce((s, e) => s + (e.duration_ms || 0), 0);
  const totalCalls = data.length;
  const avgMs = totalCalls > 0 ? Math.round(totalMs / totalCalls) : 0;
  let maxEntry = null;
  let maxMs = 0;
  for (const e of data) {
    if (e.duration_ms > maxMs) { maxMs = e.duration_ms; maxEntry = e; }
  }

  document.getElementById('total-time').textContent = formatDuration(totalMs);
  document.getElementById('total-calls').textContent = totalCalls;
  document.getElementById('avg-duration').textContent = formatDuration(avgMs);
  if (maxEntry) {
    document.getElementById('max-duration').innerHTML =
      `${formatDuration(maxMs)} <span style="font-size:13px;color:var(--text-dim);margin-left:4px;">${maxEntry.tool_name}</span>`;
  } else {
    document.getElementById('max-duration').textContent = '--';
  }
}

function renderGantt(data) {
  const container = document.getElementById('gantt-chart');
  if (!container) return;

  if (data.length === 0) {
    container.innerHTML = '<div style="padding:40px;text-align:center;color:var(--text-dim)">暂无数据</div>';
    return;
  }

  try {
    const sorted = [...data].sort((a, b) => a.start - b.start);
    const sessionStart = Math.min(...sorted.map(e => e.start));
    const sessionEnd = Math.max(...sorted.map(e => e.end));
    const totalSpan = sessionEnd - sessionStart || 1;

    // 动态计算轨道宽度：至少600px，每个任务至少4px bar宽度
    // 基准：最小任务宽度 8px，第10分位任务至少 20px 宽
    const minBarPx = 8;
    const sortedByDur = [...sorted].map(e => e.duration_ms || 1).sort((a, b) => a - b);
    const p10Dur = sortedByDur[Math.floor(sortedByDur.length * 0.1)] || sortedByDur[0];
    const pxPerMsTarget = 20 / p10Dur;
    const trackWidthByTask = totalSpan * pxPerMsTarget;
    const trackWidth = Math.max(800, Math.min(trackWidthByTask, 4000));
    const pxPerMs = trackWidth / totalSpan;
    const labelWidth = 160;

    // 生成时间刻度（5个等分点）
    const tickCount = 5;
    const ticks = [];
    for (let i = 0; i <= tickCount; i++) {
      const offsetMs = (totalSpan / tickCount) * i;
      const tickTime = new Date(sessionStart + offsetMs);
      ticks.push({
        label: tickTime.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
        left: (offsetMs * pxPerMs).toFixed(1),
      });
    }

    // 构建 HTML
    let html = `<div class="custom-gantt" style="width:${labelWidth + trackWidth}px;min-width:100%;">`;
    html += `<div class="gantt-header-row" style="position:relative;width:${labelWidth + trackWidth}px;">`;
    ticks.forEach(t => {
      html += `<div class="gantt-header-tick" style="left:${labelWidth + parseFloat(t.left)}px;">${t.label}</div>`;
      html += `<div class="gantt-header-tick-line" style="left:${labelWidth + parseFloat(t.left)}px;"></div>`;
    });
    html += `</div>`;
    html += `<div class="gantt-timeline">`;

    sorted.forEach((e, i) => {
      const left = ((e.start - sessionStart) * pxPerMs).toFixed(1);
      const width = Math.max(minBarPx, e.duration_ms * pxPerMs).toFixed(1);
      const color = toolColor(e.tool_name);
      const summary = (e.tool_input_summary || '').replace(/"/g, '&quot;').replace(/</g, '&lt;');
      const duration = formatDuration(e.duration_ms);

      html += `<div class="gantt-task-row" style="width:${labelWidth + trackWidth}px;">`;
      html += `<span class="gantt-row-label" title="${e.tool_name}">${i + 1}. ${e.tool_name}</span>`;
      html += `<div class="gantt-row-track">`;
      html += `<div class="gantt-bar"
          style="left:${left}px;width:${width}px;background:${color};"
          data-tool="${e.tool_name}"
          data-duration="${duration}"
          data-summary="${summary}">`;
      html += `</div>`;
      html += `</div>`;
      html += `</div>`;
    });

    html += `</div></div>`;
    container.innerHTML = html;

    // 添加 tooltip 交互
    const tooltip = document.getElementById('gantt-tooltip') || createTooltip();
    container.querySelectorAll('.gantt-bar').forEach(bar => {
      bar.addEventListener('mouseenter', (e) => {
        tooltip.innerHTML = `<strong style="color:#58a6ff;">${bar.dataset.tool}</strong>
          <span style="margin-left:8px;color:#8b949e;">${bar.dataset.duration}</span>
          ${bar.dataset.summary ? `<div style="margin-top:4px;color:#6e7681;font-size:11px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${bar.dataset.summary}</div>` : ''}`;
        tooltip.style.display = 'block';
        updateTooltipPos(e, tooltip);
      });
      bar.addEventListener('mousemove', (e) => updateTooltipPos(e, tooltip));
      bar.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });
    });
  } catch (err) {
    console.error('renderGantt error:', err);
    container.innerHTML = `<div style="padding:40px;text-align:center;color:var(--danger);">甘特图渲染错误: ${err.message}</div>`;
  }
}

function createTooltip() {
  const el = document.createElement('div');
  el.id = 'gantt-tooltip';
  el.className = 'gantt-tooltip';
  document.body.appendChild(el);
  return el;
}

function updateTooltipPos(e, tooltip) {
  let x = e.clientX + 12;
  let y = e.clientY - 10;
  if (x + tooltip.offsetWidth > window.innerWidth) x = e.clientX - tooltip.offsetWidth - 12;
  if (y + tooltip.offsetHeight > window.innerHeight) y = e.clientY - tooltip.offsetHeight - 10;
  tooltip.style.left = x + 'px';
  tooltip.style.top = y + 'px';
}

function renderDonut(data) {
  const ctx = document.getElementById('donut-chart');
  if (!ctx) return;

  try {
    if (data.length === 0) {
      if (donutChart) { donutChart.destroy(); donutChart = null; }
      return;
    }

    const byTool = {};
    for (const e of data) {
      if (!byTool[e.tool_name]) byTool[e.tool_name] = 0;
      byTool[e.tool_name] += e.duration_ms || 0;
    }

    const sorted = Object.entries(byTool).sort((a, b) => b[1] - a[1]);
    const labels = sorted.map(([k]) => k);
    const values = sorted.map(([, v]) => v);
    const colors = sorted.map(([k]) => toolColor(k));

    if (donutChart) donutChart.destroy();

    donutChart = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels,
        datasets: [{
          data: values,
          backgroundColor: colors,
          borderColor: '#161b22',
          borderWidth: 2,
        }],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            position: 'bottom',
            labels: { color: '#8b949e', padding: 12, font: { size: 11 }, boxWidth: 10 },
          },
          tooltip: {
            callbacks: {
              label(ctx) {
                const total = values.reduce((s, v) => s + v, 0);
                const pct = total > 0 ? ((ctx.raw / total) * 100).toFixed(1) : 0;
                return `${ctx.label}: ${formatDuration(ctx.raw)} (${pct}%)`;
              },
            },
          },
        },
      },
    });
  } catch (err) {
    console.error('renderDonut error:', err);
  }
}

function renderSlowTable(data) {
  const tbody = document.getElementById('slow-tbody');
  const sorted = [...data].sort((a, b) => (b.duration_ms || 0) - (a.duration_ms || 0));
  const top = sorted.slice(0, 15);

  tbody.innerHTML = top.map((e, i) => `
    <tr>
      <td>${i + 1}</td>
      <td><span class="tool-tag" style="background:${toolColor(e.tool_name)};color:#000">${e.tool_name}</span></td>
      <td><strong>${formatDuration(e.duration_ms)}</strong></td>
      <td class="summary-cell" title="${(e.tool_input_summary || '').replace(/"/g, '&quot;')}">${e.tool_input_summary || '--'}</td>
    </tr>
  `).join('');

  if (top.length === 0) {
    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--text-dim);padding:20px">暂无数据</td></tr>';
  }
}

function renderAll(data) {
  currentData = data;

  if (data.length === 0) {
    document.getElementById('empty-placeholder').style.display = 'block';
    document.querySelector('.cards').style.opacity = '0.5';
  } else {
    document.getElementById('empty-placeholder').style.display = 'none';
    document.querySelector('.cards').style.opacity = '1';
  }

  renderSummary(data);
  renderGantt(data);
  renderDonut(data);
  renderSlowTable(data);
  console.log('renderAll done, data count:', data.length);
}

// === 主流程 ===
async function refresh(forceFull = false) {
  const select = document.getElementById('session-select');
  const selectedId = select.value;

  // 始终刷新会话列表（检测新增/删除的会话）
  const prevSessions = select.options.length;
  await loadSessions();

  // 如果会话列表变了（新增会话），自动选最新的
  if (select.options.length !== prevSessions && !selectedId) {
    select.value = select.options[1]?.value || '';
  }

  const newSelected = select.value;

  if (!newSelected) {
    renderAll([]);
    return;
  }

  // 检测会话是否切换
  if (newSelected !== currentSessionId || forceFull) {
    currentSessionId = newSelected;
    const data = await loadSessionData(currentSessionId);
    renderAll(data);
    return;
  }

  // 增量更新
  const lastEnd = currentData.length > 0
    ? Math.max(...currentData.map(e => e.end))
    : 0;
  const newEntries = await loadSessionData(currentSessionId, lastEnd);

  if (newEntries.length > 0) {
    const merged = [...currentData, ...newEntries];
    renderAll(merged);
  } else if (currentData.length === 0) {
    const data = await loadSessionData(currentSessionId);
    renderAll(data);
  }
  // else: 无新数据，不重绘
}

// === 事件绑定 ===
document.getElementById('session-select').addEventListener('change', () => {
  refresh();
});

document.getElementById('refresh-btn').addEventListener('click', () => refresh(true));

document.getElementById('auto-refresh-btn').addEventListener('click', function() {
  autoRefresh = !autoRefresh;
  this.classList.toggle('active', autoRefresh);
  this.textContent = autoRefresh ? '⟳ 自动' : '⟳ 手动';
});

// === 自动刷新 ===
setInterval(() => {
  if (autoRefresh) refresh();
}, 2000);
