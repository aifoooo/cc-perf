<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cc-perf — Claude Code Performance Dashboard</title>
<script src="chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --text-dim: #8b949e;
    --accent: #58a6ff;
    --danger: #f85149;
    --success: #3fb950;
    --warning: #d2991d;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px 24px;
    max-width: 1400px;
    margin: 0 auto;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    font-size: 20px;
    font-weight: 600;
    color: var(--accent);
  }
  .controls {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  select {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 13px;
  }
  button {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
    font-size: 13px;
  }
  button:hover { background: #1f2937; }
  button.active { background: var(--accent); color: #000; border-color: var(--accent); }
  .cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
  }
  .card__label {
    font-size: 12px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
  }
  .card__value {
    font-size: 28px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .chart-row {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 12px;
    margin-bottom: 20px;
  }
  .chart-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    position: relative;
  }
  .chart-box h2 {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-dim);
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .chart-box canvas { max-height: 400px; min-height: 300px; }
  .chart-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .chart-header h2 {
    margin-bottom: 0;
  }
  .view-switch {
    display: flex;
    gap: 4px;
  }
  .view-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 4px 10px;
    font-size: 11px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .view-btn:hover {
    background: rgba(88,166,255,0.1);
    color: var(--text);
  }
  .view-btn.active {
    background: var(--accent);
    color: #000;
    border-color: var(--accent);
  }
  /* 火焰图样式 */
  .flame-chart {
    min-width: 100%;
  }
  .flame-row {
    display: flex;
    align-items: stretch;
    height: 28px;
    margin-bottom: 2px;
  }
  .flame-bar {
    display: flex;
    align-items: center;
    padding: 0 8px;
    color: #000;
    font-size: 11px;
    font-weight: 500;
    border-radius: 3px;
    cursor: pointer;
    transition: filter 0.15s;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .flame-bar:hover {
    filter: brightness(1.1);
    box-shadow: 0 0 0 2px rgba(255,255,255,0.4);
  }
  .flame-bar span {
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .flame-tooltip {
    position: fixed;
    background: #161b22;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 14px;
    color: var(--text);
    font-size: 12px;
    z-index: 100;
    pointer-events: none;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    max-width: 320px;
    display: none;
  }
  .slow-table {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 20px;
  }
  .slow-table h2 {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-dim);
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th, td {
    text-align: left;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
  }
  th { color: var(--text-dim); font-weight: 600; font-size: 11px; text-transform: uppercase; }
  tr:hover { background: rgba(88, 166, 255, 0.04); }
  .tool-tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
  }
  .summary-cell {
    max-width: 400px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--text-dim);
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 12px;
  }
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-dim);
  }
  .empty-state p { margin-top: 8px; font-size: 14px; }
</style>
</head>
<body>

<header>
  <h1>cc-perf</h1>
  <div class="controls">
    <select id="session-select">
      <option value="">-- 选择会话 --</option>
    </select>
    <button id="refresh-btn" title="刷新数据">↻</button>
    <button id="auto-refresh-btn" class="active" title="自动刷新">⟳ 自动</button>
  </div>
</header>

<div class="cards">
  <div class="card">
    <div class="card__label">总耗时</div>
    <div class="card__value" id="total-time">--</div>
  </div>
  <div class="card">
    <div class="card__label">调用次数</div>
    <div class="card__value" id="total-calls">--</div>
  </div>
  <div class="card">
    <div class="card__label">平均耗时</div>
    <div class="card__value" id="avg-duration">--</div>
  </div>
  <div class="card">
    <div class="card__label">最慢操作</div>
    <div class="card__value" id="max-duration" style="font-size:20px">--</div>
  </div>
</div>

<div class="chart-row">
  <div class="chart-box" id="main-chart-box">
    <div class="chart-header">
      <h2 id="main-chart-title">帕累托图（瓶颈定位）</h2>
      <div class="view-switch">
        <button class="view-btn active" data-view="pareto">帕累托</button>
        <button class="view-btn" data-view="waterfall">瀑布图</button>
        <button class="view-btn" data-view="flame">火焰图</button>
        <button class="view-btn" data-view="swimlane">泳道图</button>
      </div>
    </div>
    <div id="main-chart" style="min-height:300px;"></div>
  </div>
  <div class="chart-box">
    <h2>耗时分布</h2>
    <canvas id="donut-chart"></canvas>
  </div>
</div>

<div class="slow-table">
  <h2>最慢 Top 15 步</h2>
  <div id="slow-table-content">
    <table>
      <thead><tr><th>#</th><th>工具</th><th>耗时</th><th>操作</th></tr></thead>
      <tbody id="slow-tbody"></tbody>
    </table>
  </div>
</div>

<div id="empty-placeholder" class="empty-state" style="display:none">
  <p>暂无数据 — 执行一些操作后刷新即可</p>
</div>

<script>
// === 颜色方案（按工具类型） ===
const TOOL_COLORS = {
  Bash: 'rgba(255,99,132,0.85)',
  Read: 'rgba(54,162,235,0.85)',
  Write: 'rgba(255,205,86,0.85)',
  Edit: 'rgba(75,192,192,0.85)',
  Agent: 'rgba(153,102,255,0.85)',
  Grep: 'rgba(255,159,64,0.85)',
  Glob: 'rgba(201,203,207,0.85)',
  WebFetch: 'rgba(123,200,164,0.85)',
  WebSearch: 'rgba(232,160,191,0.85)',
  TaskOutput: 'rgba(148,148,148,0.85)',
  Skill: 'rgba(100,200,200,0.85)',
};
const DEFAULT_COLOR = 'rgba(168,168,168,0.85)';

const TOOL_BORDER_COLORS = {};
for (const [k, v] of Object.entries(TOOL_COLORS)) {
  TOOL_BORDER_COLORS[k] = v.replace('0.85', '1');
}
const DEFAULT_BORDER = 'rgba(168,168,168,1)';

function toolColor(tool) { return TOOL_COLORS[tool] || DEFAULT_COLOR; }
function toolBorder(tool) { return TOOL_BORDER_COLORS[tool] || DEFAULT_BORDER; }

// === 状态 ===
let currentSessionId = '';
let currentData = [];
let autoRefresh = true;
let donutChart = null;

// === 格式化 ===
function formatDuration(ms) {
  if (!ms && ms !== 0) return '--';
  if (ms < 1000) return `${ms}ms`;
  if (ms < 60000) return `${(ms / 1000).toFixed(1)}s`;
  const m = Math.floor(ms / 60000);
  const s = Math.round((ms % 60000) / 1000);
  return `${m}m${s}s`;
}

// === API ===
async function fetchJSON(url) {
  const res = await fetch(url);
  return res.json();
}

// === 加载会话列表 ===
async function loadSessions() {
  const sessions = await fetchJSON('/api/sessions');
  const select = document.getElementById('session-select');
  const current = select.value;
  select.innerHTML = '<option value="">-- 选择会话 --</option>';
  for (const s of sessions) {
    const opt = document.createElement('option');
    opt.value = s.id;
    const date = new Date(s.mtime).toLocaleString('zh-CN');
    opt.textContent = `${s.id.substring(0,12)}… — ${s.entry_count}次调用, ${formatDuration(s.total_ms)} — ${date}`;
    select.appendChild(opt);
  }
  // 保持选中或自动选最新
  if (current && sessions.find(s => s.id === current)) {
    select.value = current;
  } else if (sessions.length > 0 && !currentSessionId) {
    select.value = sessions[0].id;
    currentSessionId = sessions[0].id;
  }
  return sessions;
}

// === 加载会话数据 ===
async function loadSessionData(sessionId, since) {
  let url = `/api/session/${sessionId}`;
  if (since) url += `/since/${since}`;
  return fetchJSON(url);
}

// === 渲染 ===
function renderSummary(data) {
  const totalMs = data.reduce((s, e) => s + (e.duration_ms || 0), 0);
  const totalCalls = data.length;
  const avgMs = totalCalls > 0 ? Math.round(totalMs / totalCalls) : 0;
  let maxEntry = null;
  let maxMs = 0;
  for (const e of data) {
    if (e.duration_ms > maxMs) { maxMs = e.duration_ms; maxEntry = e; }
  }

  document.getElementById('total-time').textContent = formatDuration(totalMs);
  document.getElementById('total-calls').textContent = totalCalls;
  document.getElementById('avg-duration').textContent = formatDuration(avgMs);
  if (maxEntry) {
    document.getElementById('max-duration').innerHTML =
      `${formatDuration(maxMs)} <span style="font-size:13px;color:var(--text-dim);margin-left:4px;">${maxEntry.tool_name}</span>`;
  } else {
    document.getElementById('max-duration').textContent = '--';
  }
}

// === 主图表（支持多视图切换） ===
let mainChart = null;
let currentView = 'pareto';

const VIEW_TITLES = {
  pareto: '帕累托图（瓶颈定位）',
  waterfall: '瀑布图（时间序列）',
  flame: '火焰图（耗时占比）',
  swimlane: '泳道图（时间线分布）',
};

function renderMainChart(data, view = currentView) {
  currentView = view;

  // 更新标题和按钮状态
  document.getElementById('main-chart-title').textContent = VIEW_TITLES[view];
  document.querySelectorAll('.view-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.view === view);
  });

  // 根据视图类型调用不同渲染函数
  switch (view) {
    case 'pareto': renderParetoView(data); break;
    case 'waterfall': renderWaterfallView(data); break;
    case 'flame': renderFlameView(data); break;
    case 'swimlane': renderSwimlaneView(data); break;
  }
}

// === 帕累托图：80/20法则定位瓶颈 ===
function renderParetoView(data) {
  const container = document.getElementById('main-chart');
  if (!container) return;

  // 清除火焰图的 HTML 内容
  container.innerHTML = '<canvas id="pareto-canvas"></canvas>';
  const ctx = document.getElementById('pareto-canvas');

  if (data.length === 0) {
    if (mainChart) { mainChart.destroy(); mainChart = null; }
    return;
  }

  // 按工具聚合耗时
  const byTool = {};
  for (const e of data) {
    if (!byTool[e.tool_name]) byTool[e.tool_name] = 0;
    byTool[e.tool_name] += e.duration_ms || 0;
  }

  const sorted = Object.entries(byTool).sort((a, b) => b[1] - a[1]);
  const labels = sorted.map(([k]) => k);
  const values = sorted.map(([, v]) => v);
  const total = values.reduce((s, v) => s + v, 0);

  let cumPct = 0;
  const cumulative = values.map(v => {
    cumPct += (v / total) * 100;
    return cumPct;
  });

  const colors = sorted.map(([k]) => toolColor(k));

  if (mainChart) mainChart.destroy();

  mainChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [
        {
          type: 'bar',
          label: '耗时',
          data: values,
          backgroundColor: colors,
          borderColor: '#161b22',
          borderWidth: 1,
          yAxisID: 'y',
          order: 2,
        },
        {
          type: 'line',
          label: '累计%',
          data: cumulative,
          borderColor: '#f85149',
          backgroundColor: 'rgba(248,81,73,0.1)',
          borderWidth: 2,
          pointRadius: 4,
          pointBackgroundColor: '#f85149',
          tension: 0.1,
          yAxisID: 'y1',
          order: 1,
        }
      ],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { position: 'top', labels: { color: '#8b949e', padding: 12, font: { size: 11 } } },
        tooltip: {
          callbacks: {
            label(ctx) {
              if (ctx.dataset.label === '耗时') {
                const pct = total > 0 ? ((ctx.raw / total) * 100).toFixed(1) : 0;
                return `${formatDuration(ctx.raw)} (${pct}%)`;
              }
              return `累计: ${ctx.raw.toFixed(1)}%`;
            },
          },
        },
      },
      scales: {
        x: { ticks: { color: '#8b949e', font: { size: 10 } }, grid: { color: 'rgba(48,54,61,0.3)' } },
        y: {
          type: 'linear', position: 'left',
          title: { display: true, text: '耗时', color: '#8b949e' },
          ticks: { color: '#8b949e', callback: v => formatDuration(v) },
          grid: { color: 'rgba(48,54,61,0.3)' },
        },
        y1: {
          type: 'linear', position: 'right', min: 0, max: 100,
          title: { display: true, text: '累计%', color: '#f85149' },
          ticks: { color: '#f85149', callback: v => v + '%' },
          grid: { drawOnChartArea: false },
        },
      },
    },
  });
}

// === 瀑布图：时间序列显示操作耗时 ===
function renderWaterfallView(data) {
  const container = document.getElementById('main-chart');
  if (!container) return;

  container.innerHTML = '<canvas id="waterfall-canvas"></canvas>';
  const ctx = document.getElementById('waterfall-canvas');

  if (data.length === 0) {
    if (mainChart) { mainChart.destroy(); mainChart = null; }
    return;
  }

  // 按时间排序，取最近50个操作
  const sorted = [...data].sort((a, b) => a.start - b.start).slice(-50);
  const sessionStart = sorted[0]?.start || 0;

  const labels = sorted.map((e, i) => {
    const t = new Date(e.start);
    return t.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  });

  // 瀑布图：每个 bar 从上一个结束位置开始
  let offset = 0;
  const baseData = [];
  const durationData = [];
  const colors = [];

  sorted.forEach(e => {
    const relativeStart = e.start - sessionStart;
    // 如果有空隙，填充空白
    if (relativeStart > offset) {
      baseData.push(offset);
      durationData.push(relativeStart - offset);
      colors.push('rgba(48,54,61,0.3)'); // 空隙用暗色
    }
    baseData.push(relativeStart);
    durationData.push(e.duration_ms || 0);
    colors.push(toolColor(e.tool_name));
    offset = relativeStart + (e.duration_ms || 0);
  });

  if (mainChart) mainChart.destroy();

  mainChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        label: '耗时',
        data: durationData.slice(-50),
        backgroundColor: colors.slice(-50),
        borderColor: '#161b22',
        borderWidth: 1,
      }],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            title(ctx) {
              const idx = ctx[0].dataIndex;
              const e = sorted[idx];
              return e ? `${e.tool_name}` : '';
            },
            label(ctx) {
              const idx = ctx.dataIndex;
              const e = sorted[idx];
              if (!e) return '';
              return [formatDuration(e.duration_ms), (e.tool_input_summary || '').substring(0, 40)];
            },
          },
        },
      },
      scales: {
        x: {
          ticks: { color: '#8b949e', font: { size: 9 }, maxRotation: 45 },
          grid: { color: 'rgba(48,54,61,0.3)' },
        },
        y: {
          stacked: false,
          title: { display: true, text: '耗时', color: '#8b949e' },
          ticks: { color: '#8b949e', callback: v => formatDuration(v) },
          grid: { color: 'rgba(48,54,61,0.3)' },
        },
      },
    },
  });
}

// === 火焰图：耗时占比可视化 ===
function renderFlameView(data) {
  const container = document.getElementById('main-chart');
  if (!container) return;

  // 火焰图用 HTML 渲染，不用 Canvas
  container.innerHTML = '<div id="flame-container" style="min-height:300px;overflow:auto;"></div>';
  const flameContainer = document.getElementById('flame-container');

  if (data.length === 0) {
    flameContainer.innerHTML = '<div style="padding:40px;text-align:center;color:var(--text-dim)">暂无数据</div>';
    return;
  }

  // 按工具聚合，计算占比
  const byTool = {};
  const totalMs = data.reduce((s, e) => s + (e.duration_ms || 0), 0);
  for (const e of data) {
    if (!byTool[e.tool_name]) byTool[e.tool_name] = { ms: 0, count: 0, samples: [] };
    byTool[e.tool_name].ms += e.duration_ms || 0;
    byTool[e.tool_name].count++;
    if (byTool[e.tool_name].samples.length < 3) {
      byTool[e.tool_name].samples.push((e.tool_input_summary || '').substring(0, 30));
    }
  }

  const sorted = Object.entries(byTool).sort((a, b) => b[1].ms - a[1].ms);
  const maxMs = sorted[0]?.[1].ms || 1;

  let html = '<div class="flame-chart">';
  sorted.forEach(([tool, info]) => {
    const pct = (info.ms / totalMs * 100).toFixed(1);
    const widthPct = Math.max(5, (info.ms / maxMs) * 100);
    const color = toolColor(tool);

    html += `<div class="flame-row">
      <div class="flame-bar" style="width:${widthPct}%;background:${color};"
           data-tool="${tool}" data-ms="${info.ms}" data-count="${info.count}" data-pct="${pct}"
           data-samples="${info.samples.join(' | ')}">
        <span>${tool} ${formatDuration(info.ms)} (${pct}%)</span>
      </div>
    </div>`;
  });
  html += '</div>';
  flameContainer.innerHTML = html;

  // 添加 tooltip
  const tooltip = document.getElementById('flame-tooltip') || createFlameTooltip();
  flameContainer.querySelectorAll('.flame-bar').forEach(bar => {
    bar.addEventListener('mouseenter', e => {
      tooltip.innerHTML = `<strong style="color:#58a6ff;">${bar.dataset.tool}</strong>
        <div style="margin-top:4px;color:#8b949e;">
          耗时: ${formatDuration(parseInt(bar.dataset.ms))} (${bar.dataset.pct}%)
        </div>
        <div style="color:#6e7681;font-size:11px;">调用 ${bar.dataset.count} 次</div>
        <div style="color:#484f58;font-size:10px;margin-top:2px;">${bar.dataset.samples}</div>`;
      tooltip.style.display = 'block';
      positionTooltip(e, tooltip);
    });
    bar.addEventListener('mousemove', e => positionTooltip(e, tooltip));
    bar.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });
  });
}

function createFlameTooltip() {
  const el = document.createElement('div');
  el.id = 'flame-tooltip';
  el.className = 'flame-tooltip';
  document.body.appendChild(el);
  return el;
}

function positionTooltip(e, tooltip) {
  let x = e.clientX + 12, y = e.clientY + 12;
  if (x + tooltip.offsetWidth > window.innerWidth) x = e.clientX - tooltip.offsetWidth - 12;
  if (y + tooltip.offsetHeight > window.innerHeight) y = e.clientY - tooltip.offsetHeight - 12;
  tooltip.style.left = x + 'px';
  tooltip.style.top = y + 'px';
}

// === 泳道图：时间线分布 ===
function renderSwimlaneView(data) {
  const container = document.getElementById('main-chart');
  if (!container) return;

  container.innerHTML = '<div id="swimlane-container" style="min-height:350px;overflow-x:auto;"></div>';
  const swimlaneContainer = document.getElementById('swimlane-container');

  if (data.length === 0) {
    swimlaneContainer.innerHTML = '<div style="padding:40px;text-align:center;color:var(--text-dim)">暂无数据</div>';
    return;
  }

  // 按时间排序
  const sorted = [...data].sort((a, b) => a.start - b.start);
  const minTime = sorted[0]?.start || 0;
  const maxTime = Math.max(...sorted.map(e => e.end || 0));
  const timeRange = maxTime - minTime || 1;

  // 按工具类型分组
  const byTool = {};
  for (const e of sorted) {
    if (!byTool[e.tool_name]) byTool[e.tool_name] = [];
    byTool[e.tool_name].push(e);
  }

  // 按总耗时排序工具
  const toolOrder = Object.entries(byTool)
    .map(([tool, entries]) => ({
      tool,
      entries,
      totalMs: entries.reduce((s, e) => s + (e.duration_ms || 0), 0)
    }))
    .sort((a, b) => b.totalMs - a.totalMs);

  // 渲染泳道
  let html = '<div class="swimlane-chart">';
  html += '<div class="swimlane-header" style="display:flex;border-bottom:1px solid var(--border);padding-bottom:8px;margin-bottom:8px;">';
  html += '<div style="width:80px;color:var(--text-dim);font-size:11px;font-weight:600;">工具</div>';
  html += '<div style="flex:1;display:flex;justify-content:space-between;color:var(--text-dim);font-size:10px;">';
  html += '<span>开始</span><span>时间线</span><span>结束</span></div></div>';

  for (const { tool, entries, totalMs } of toolOrder) {
    const color = toolColor(tool);
    html += `<div class="swimlane-row" style="display:flex;align-items:center;margin-bottom:6px;min-height:24px;">`;
    html += `<div style="width:80px;font-size:11px;font-weight:500;color:var(--text);">${tool}</div>`;
    html += `<div class="swimlane-track" style="flex:1;position:relative;height:20px;background:rgba(48,54,61,0.2);border-radius:3px;">`;

    for (const e of entries) {
      const startPct = ((e.start - minTime) / timeRange) * 100;
      const widthPct = Math.max(0.3, ((e.duration_ms || 0) / timeRange) * 100);
      const left = startPct;
      const title = `${e.tool_name}: ${formatDuration(e.duration_ms)}\n${(e.tool_input_summary || '').substring(0, 60)}`;

      html += `<div class="swimlane-bar" style="
        position:absolute;
        left:${left}%;
        width:${widthPct}%;
        height:16px;
        top:2px;
        background:${color};
        border-radius:2px;
        cursor:pointer;
        transition:filter 0.15s;
        min-width:2px;
      " title="${title}" data-tool="${tool}" data-ms="${e.duration_ms}" data-summary="${(e.tool_input_summary || '').substring(0, 40)}"></div>`;
    }

    html += '</div></div>';
  }
  html += '</div>';
  swimlaneContainer.innerHTML = html;

  // 添加 tooltip 交互
  const tooltip = document.getElementById('flame-tooltip') || createFlameTooltip();
  swimlaneContainer.querySelectorAll('.swimlane-bar').forEach(bar => {
    bar.addEventListener('mouseenter', e => {
      tooltip.innerHTML = `<strong style="color:#58a6ff;">${bar.dataset.tool}</strong>
        <div style="margin-top:4px;color:#8b949e;">耗时: ${formatDuration(parseInt(bar.dataset.ms))}</div>
        <div style="color:#6e7681;font-size:11px;margin-top:2px;">${bar.dataset.summary}</div>`;
      tooltip.style.display = 'block';
      positionTooltip(e, tooltip);
    });
    bar.addEventListener('mousemove', e => positionTooltip(e, tooltip));
    bar.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });
  });
}

function renderDonut(data) {
  const ctx = document.getElementById('donut-chart');
  if (!ctx) return;

  try {
    if (data.length === 0) {
      if (donutChart) { donutChart.destroy(); donutChart = null; }
      return;
    }

    const byTool = {};
    for (const e of data) {
      if (!byTool[e.tool_name]) byTool[e.tool_name] = 0;
      byTool[e.tool_name] += e.duration_ms || 0;
    }

    const sorted = Object.entries(byTool).sort((a, b) => b[1] - a[1]);
    const labels = sorted.map(([k]) => k);
    const values = sorted.map(([, v]) => v);
    const colors = sorted.map(([k]) => toolColor(k));

    if (donutChart) donutChart.destroy();

    donutChart = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels,
        datasets: [{
          data: values,
          backgroundColor: colors,
          borderColor: '#161b22',
          borderWidth: 2,
        }],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            position: 'bottom',
            labels: { color: '#8b949e', padding: 12, font: { size: 11 }, boxWidth: 10 },
          },
          tooltip: {
            callbacks: {
              label(ctx) {
                const total = values.reduce((s, v) => s + v, 0);
                const pct = total > 0 ? ((ctx.raw / total) * 100).toFixed(1) : 0;
                return `${ctx.label}: ${formatDuration(ctx.raw)} (${pct}%)`;
              },
            },
          },
        },
      },
    });
  } catch (err) {
    console.error('renderDonut error:', err);
  }
}

function renderSlowTable(data) {
  const tbody = document.getElementById('slow-tbody');
  const sorted = [...data].sort((a, b) => (b.duration_ms || 0) - (a.duration_ms || 0));
  const top = sorted.slice(0, 15);

  tbody.innerHTML = top.map((e, i) => `
    <tr>
      <td>${i + 1}</td>
      <td><span class="tool-tag" style="background:${toolColor(e.tool_name)};color:#000">${e.tool_name}</span></td>
      <td><strong>${formatDuration(e.duration_ms)}</strong></td>
      <td class="summary-cell" title="${(e.tool_input_summary || '').replace(/"/g, '&quot;')}">${e.tool_input_summary || '--'}</td>
    </tr>
  `).join('');

  if (top.length === 0) {
    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--text-dim);padding:20px">暂无数据</td></tr>';
  }
}

function renderAll(data) {
  currentData = data;

  if (data.length === 0) {
    document.getElementById('empty-placeholder').style.display = 'block';
    document.querySelector('.cards').style.opacity = '0.5';
  } else {
    document.getElementById('empty-placeholder').style.display = 'none';
    document.querySelector('.cards').style.opacity = '1';
  }

  renderSummary(data);
  renderMainChart(data);
  renderDonut(data);
  renderSlowTable(data);
}

// === 主流程 ===
async function refresh(forceFull = false) {
  const select = document.getElementById('session-select');
  const selectedId = select.value;

  // 始终刷新会话列表（检测新增/删除的会话）
  const prevSessions = select.options.length;
  await loadSessions();

  // 如果会话列表变了（新增会话），自动选最新的
  if (select.options.length !== prevSessions && !selectedId) {
    select.value = select.options[1]?.value || '';
  }

  const newSelected = select.value;

  if (!newSelected) {
    renderAll([]);
    return;
  }

  // 检测会话是否切换
  if (newSelected !== currentSessionId || forceFull) {
    currentSessionId = newSelected;
    const data = await loadSessionData(currentSessionId);
    renderAll(data);
    return;
  }

  // 增量更新
  const lastEnd = currentData.length > 0
    ? Math.max(...currentData.map(e => e.end))
    : 0;
  const newEntries = await loadSessionData(currentSessionId, lastEnd);

  if (newEntries.length > 0) {
    const merged = [...currentData, ...newEntries];
    renderAll(merged);
  } else if (currentData.length === 0) {
    const data = await loadSessionData(currentSessionId);
    renderAll(data);
  }
  // else: 无新数据，不重绘
}

// === 事件绑定 ===
document.getElementById('session-select').addEventListener('change', () => {
  refresh();
});

document.getElementById('refresh-btn').addEventListener('click', () => refresh(true));

document.getElementById('auto-refresh-btn').addEventListener('click', function() {
  autoRefresh = !autoRefresh;
  this.classList.toggle('active', autoRefresh);
  this.textContent = autoRefresh ? '⟳ 自动' : '⟳ 手动';
});

// 视图切换
document.querySelectorAll('.view-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    renderMainChart(currentData, btn.dataset.view);
  });
});

// === 自动刷新 ===
setInterval(() => {
  if (autoRefresh) refresh();
}, 2000);

// === 初始加载 ===
refresh();
</script>
